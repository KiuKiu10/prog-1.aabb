<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>誰が書いたでしょう？オンライン</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
body {
  font-family: "Arial", "Hiragino Kaku Gothic ProN", sans-serif;
  background: #eaf7ff;
  margin: 0;
  color: #333;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 30px 20px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
  margin-bottom: 20px;
}

h1 {
  text-align: center;
  color: #4aa9d8;
  margin-bottom: 30px;
}

h2 {
  color: #4aa9d8;
}

input, textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: 2px solid #d7edf7;
  border-radius: 12px;
  font-size: 16px;
  margin: 8px 0 15px;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  border: none;
  border-radius: 12px;
  padding: 12px 20px;
  font-size: 16px;
  cursor: pointer;
  background: #59b8e5;
  color: white;
  margin: 5px;
}

button:hover {
  opacity: 0.85;
}

button:disabled {
  background: #ccc;
  cursor: not-allowed;
}

.room {
  background: #eefaff;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  font-size: 18px;
  margin-bottom: 20px;
}

.player {
  padding: 10px;
  border-bottom: 1px solid #eee;
}

.answer-box {
  background: #f7fcff;
  border-radius: 15px;
  padding: 20px;
  margin: 20px 0;
  font-size: 20px;
  text-align: center;
}

.choice {
  display: block;
  width: calc(100% - 10px);
  margin: 8px auto;
  background: #fff;
  color: #333;
  border: 2px solid #8fd0ec;
}

.choice:hover {
  background: #eefaff;
}

.correct {
  background: #dff7df;
  border: 2px solid #79c879;
}

.wrong {
  background: #ffe3e3;
  border: 2px solid #e88;
}

.hidden {
  display: none;
}

.center {
  text-align: center;
}

.small {
  font-size: 13px;
  color: #777;
}

.warning {
  color: #d66;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<!-- ホーム -->
<div id="home" class="card">
  <h1>🎮 誰が書いたでしょう？</h1>

  <label>あなたの名前</label>
  <input id="nameInput" placeholder="例：たけだ">

  <button onclick="createRoom()">部屋を作る</button>
  <button onclick="showJoin()">部屋に参加する</button>

  <div id="joinArea" class="hidden">
    <label>ルームID</label>
    <input id="roomInput" placeholder="例：ABC12">
    <button onclick="joinRoom()">参加する</button>
  </div>
</div>


<!-- ロビー -->
<div id="lobby" class="card hidden">
  <h1>👥 待機ルーム</h1>

  <div class="room">
    ルームID：<strong id="roomDisplay"></strong>
  </div>

  <h2>参加者</h2>
  <div id="playerList"></div>

  <div id="hostStartArea" class="center hidden">
    <p class="small">全員が参加したらゲームを開始してください。</p>
    <button onclick="startGame()">ゲーム開始</button>
  </div>

  <p id="waitingText" class="center small">
    ホストがゲームを開始するのを待っています。
  </p>
</div>


<!-- 回答 -->
<div id="answer" class="card hidden">
  <h1>✏️ 回答タイム</h1>

  <div class="answer-box">
    <div class="small">お題</div>
    <strong id="topicText"></strong>
  </div>

  <textarea id="answerInput" placeholder="あなたの回答を書いてください"></textarea>

  <div class="center">
    <button id="answerButton" onclick="submitAnswer()">回答する</button>
  </div>

  <p id="answerStatus" class="center small"></p>
</div>


<!-- ホスト管理 -->
<div id="hostManage" class="card hidden">
  <h1>📝 回答状況</h1>

  <div id="answerProgress" class="center"></div>

  <div id="hostAnswerList"></div>

  <div class="center">
    <button id="startGuessButton" onclick="startGuessing()" disabled>
      投票を開始する
    </button>
  </div>
</div>


<!-- 投票 -->
<div id="guess" class="card hidden">
  <h1>🤔 誰が書いたでしょう？</h1>

  <div class="answer-box">
    <div class="small">回答</div>
    <strong id="guessAnswer"></strong>
  </div>

  <p id="guessInstruction" class="center">
    この回答を書いたと思う人を選んでください。
  </p>

  <div id="choices"></div>

  <p id="voteStatus" class="center small"></p>
</div>


<!-- 結果 -->
<div id="hostReveal" class="card hidden">
  <h1>🎉 結果</h1>

  <div class="answer-box">
    <div class="small">回答</div>
    <strong id="revealAnswer"></strong>
  </div>

  <div class="center">
    <p>この回答を書いたのは……</p>
    <h2 id="revealAuthor"></h2>
  </div>

  <div id="revealVotes"></div>
</div>


<!-- 終了 -->
<div id="finished" class="card hidden">
  <h1>🎊 ゲーム終了！</h1>

  <div id="finalResults"></div>

  <div class="center">
    <button onclick="location.reload()">もう一度遊ぶ</button>
  </div>
</div>

</div>


<script>

let peer = null;
let hostConn = null;

let room = "";
let myName = "";
let isHost = false;

let hostPeerId = "";
let hostDisplayName = "";

let players = [];
let connections = [];

let topic = "";
let answers = [];

let currentQuestion = 0;
let votes = {};


// -------------------------
// 共通
// -------------------------

function show(id) {
  document.querySelectorAll(".card").forEach(el => {
    el.classList.add("hidden");
  });

  document.getElementById(id).classList.remove("hidden");
}

function generateRoom() {
  return Math.random().toString(36).substring(2, 7).toUpperCase();
}

function amHost() {
  return isHost === true;
}


// -------------------------
// ホーム
// -------------------------

function showJoin() {
  document.getElementById("joinArea").classList.remove("hidden");
}


// -------------------------
// 部屋作成
// -------------------------

function createRoom() {

  myName = document.getElementById("nameInput").value.trim();

  if (!myName) {
    alert("名前を入力してください");
    return;
  }

  isHost = true;

  room = generateRoom();

  document.getElementById("roomDisplay").textContent = room;

  peer = new Peer("darewrote-" + room);

  peer.on("open", id => {

    hostPeerId = id;
    hostDisplayName = myName;

    players = [
      {
        id: peer.id,
        name: myName,
        host: true
      }
    ];

    show("lobby");

    updatePlayerList();

    document.getElementById("hostStartArea").classList.remove("hidden");
    document.getElementById("waitingText").classList.add("hidden");

    updateURL();
  });


  peer.on("connection", conn => {

    connections.push(conn);

    conn.on("data", data => {

      if (data.type === "join") {

        // すでに同じPeerが入っていたら追加しない
        if (!players.some(p => p.id === conn.peer)) {

          players.push({
            id: conn.peer,
            name: data.name,
            host: false
          });

        }

        updatePlayerList();

        broadcastState();
      }


      if (data.type === "answer") {

        answers.push({
          peer: conn.peer,
          name: data.name,
          text: data.text
        });

        updateHostAnswerList();

        checkAllAnswered();
      }


      if (data.type === "vote") {

        if (!votes[currentQuestion]) {
          votes[currentQuestion] = {};
        }

        // 投票者 → 投票先
        votes[currentQuestion][conn.peer] = data.choice;

        checkAllVotes();
      }

    });
  });


  peer.on("error", err => {
    console.log(err);

    if (err.type === "unavailable-id") {
      alert("このルームIDはすでに使用されています。ページを再読み込みしてください。");
    } else {
      alert("通信エラーが発生しました。");
    }
  });
}


// -------------------------
// 部屋参加
// -------------------------

function joinRoom() {

  myName = document.getElementById("nameInput").value.trim();
  room = document.getElementById("roomInput").value.trim().toUpperCase();

  if (!myName) {
    alert("名前を入力してください");
    return;
  }

  if (!room) {
    alert("ルームIDを入力してください");
    return;
  }

  isHost = false;

  peer = new Peer();

  peer.on("open", id => {

    hostPeerId = "darewrote-" + room;

    hostConn = peer.connect(
      hostPeerId,
      {
        reliable: true
      }
    );


    hostConn.on("open", () => {

      hostConn.send({
        type: "join",
        name: myName
      });

    });


    hostConn.on("data", data => {

      if (data.type === "state") {

        players = data.players;
        topic = data.topic;
        hostPeerId = data.hostPeerId;
        hostDisplayName = data.hostDisplayName;

        updatePlayerList();

        if (data.gameStarted) {
          showAnswerScreen();
        }
      }


      if (data.type === "question") {

        receiveQuestion(data.answer);
      }


      if (data.type === "reveal") {

        showReveal(
          data.answer,
          data.author,
          data.voteResults
        );
      }


      if (data.type === "finished") {

        showFinished(data.results);
      }

    });


    hostConn.on("close", () => {
      alert("ホストとの接続が切れました。");
      location.reload();
    });

  });


  peer.on("error", err => {

    console.log(err);

    if (err.type === "peer-unavailable") {
      alert("そのルームは存在しないか、ホストがまだ部屋を作っていません。");
    } else {
      alert("通信エラーが発生しました。");
    }

  });


  document.getElementById("roomDisplay").textContent = room;

  show("lobby");

  updateURL();
}


// -------------------------
// URL
// -------------------------

function updateURL() {

  if (!room) return;

  const url =
    location.origin +
    location.pathname +
    "?room=" +
    room;

  history.replaceState(null, "", url);
}


// -------------------------
// プレイヤー一覧
// -------------------------

function updatePlayerList() {

  const list = document.getElementById("playerList");

  list.innerHTML = "";

  players.forEach(p => {

    const div = document.createElement("div");

    div.className = "player";

    div.textContent =
      p.name +
      (p.host ? " 👑" : "");

    list.appendChild(div);

  });
}


// -------------------------
// 状態送信
// -------------------------

function broadcastState() {

  if (!isHost) return;

  connections.forEach(conn => {

    if (conn.open) {

      conn.send({
        type: "state",
        players: players,
        topic: topic,
        hostPeerId: hostPeerId,
        hostDisplayName: hostDisplayName,
        gameStarted: false
      });

    }

  });
}


// -------------------------
// ゲーム開始
// -------------------------

function startGame() {

  if (!isHost) return;

  if (players.length < 2) {
    alert("2人以上必要です。");
    return;
  }

  topic = prompt(
    "お題を入力してください",
    "最近あったちょっと嬉しかったこと"
  );

  if (!topic) return;

  answers = [];

  players.forEach(p => {
    p.answered = false;
  });

  connections.forEach(conn => {

    if (conn.open) {

      conn.send({
        type: "state",
        players: players,
        topic: topic,
        hostPeerId: hostPeerId,
        hostDisplayName: hostDisplayName,
        gameStarted: true
      });

    }

  });

  showAnswerScreen();
}


// -------------------------
// 回答画面
// -------------------------

function showAnswerScreen() {

  document.getElementById("topicText").textContent = topic;

  document.getElementById("answerInput").value = "";

  document.getElementById("answerButton").disabled = false;

  document.getElementById("answerStatus").textContent =
    "回答を入力してください。";

  show("answer");
}


// -------------------------
// 回答送信
// -------------------------

function submitAnswer() {

  const text =
    document.getElementById("answerInput").value.trim();

  if (!text) {
    alert("回答を入力してください");
    return;
  }

  document.getElementById("answerButton").disabled = true;

  document.getElementById("answerStatus").textContent =
    "回答しました。ほかの人を待っています。";


  // ホスト自身
  if (isHost) {

    answers.push({
      peer: peer.id,
      name: myName,
      text: text
    });

    updateHostAnswerList();

    checkAllAnswered();

    return;
  }


  // 参加者
  hostConn.send({
    type: "answer",
    name: myName,
    text: text
  });

}


// -------------------------
// 回答状況
// -------------------------

function updateHostAnswerList() {

  const list =
    document.getElementById("hostAnswerList");

  list.innerHTML = "";

  answers.forEach((a, index) => {

    const div = document.createElement("div");

    div.className = "player";

    div.textContent =
      (index + 1) +
      ". " +
      a.name +
      " ： " +
      a.text;

    list.appendChild(div);

  });


  document.getElementById("answerProgress").textContent =
    answers.length +
    " / " +
    players.length +
    " 人が回答済み";

}


// -------------------------
// 全員回答チェック
// -------------------------

function checkAllAnswered() {

  if (!isHost) return;

  updateHostAnswerList();

  if (answers.length >= players.length) {

    document.getElementById("startGuessButton").disabled = false;

  }

}


// -------------------------
// 投票開始
// -------------------------

function startGuessing() {

  if (!isHost) return;

  if (answers.length < players.length) {
    alert("まだ全員の回答が集まっていません。");
    return;
  }

  currentQuestion = 0;

  votes = {};

  showQuestionForEveryone();

}


// -------------------------
// 問題表示
// -------------------------

function showQuestionForEveryone() {

  if (currentQuestion >= answers.length) {

    finishGame();

    return;
  }

  const answer = answers[currentQuestion];

  votes[currentQuestion] = {};

  // ホスト自身の回答の場合
  // → ホスト本人は投票しない
  if (answer.peer === peer.id) {

    showHostWaiting();

  } else {

    showHostVoting(answer);

  }


  // 参加者全員へ送信
  connections.forEach(conn => {

    if (conn.open) {

      conn.send({
        type: "question",
        answer: answer
      });

    }

  });

}


// -------------------------
// ホスト：自分の回答
// -------------------------

function showHostWaiting() {

  document.getElementById("guessAnswer").textContent =
    answers[currentQuestion].text;

  document.getElementById("guessInstruction").textContent =
    "これはあなたが書いた回答です。投票せず、ほかの人の投票を待っています。";

  document.getElementById("choices").innerHTML = "";

  document.getElementById("voteStatus").textContent =
    "ほかの " +
    (players.length - 1) +
    " 人の投票を待っています。";

  show("guess");
}


// -------------------------
// ホスト：他人の回答
// -------------------------

function showHostVoting(answer) {

  document.getElementById("guessAnswer").textContent =
    answer.text;

  document.getElementById("guessInstruction").textContent =
    "この回答を書いたと思う人を選んでください。";

  const choices =
    document.getElementById("choices");

  choices.innerHTML = "";

  players.forEach(p => {

    // ★★★ ここが重要 ★★★
    // 回答を書いた本人には投票させない
    if (p.id === answer.peer) {
      return;
    }

    const button =
      document.createElement("button");

    button.className = "choice";

    button.textContent = p.name;

    button.onclick = () => {
      vote(p.id);
    };

    choices.appendChild(button);

  });

  document.getElementById("voteStatus").textContent =
    "あなたの回答ではないので投票してください。";

  show("guess");
}


// -------------------------
// 参加者：問題受信
// -------------------------

function receiveQuestion(answer) {

  document.getElementById("guessAnswer").textContent =
    answer.text;

  const choices =
    document.getElementById("choices");

  choices.innerHTML = "";


  // ★★★ 重要 ★★★
  // この回答を書いた本人なら投票しない
  if (answer.peer === peer.id) {

    document.getElementById("guessInstruction").textContent =
      "これはあなたが書いた回答です。投票せず、ほかの人の投票を待っています。";

    document.getElementById("voteStatus").textContent =
      "ほかの " +
      (players.length - 1) +
      " 人の投票を待っています。";

    show("guess");

    return;
  }


  document.getElementById("guessInstruction").textContent =
    "この回答を書いたと思う人を選んでください。";


  players.forEach(p => {

    // 念のため自分自身にも投票できないようにする
    if (p.id === peer.id) return;

    const button =
      document.createElement("button");

    button.className = "choice";

    button.textContent = p.name;

    button.onclick = () => {
      vote(p.id);
    };

    choices.appendChild(button);

  });


  document.getElementById("voteStatus").textContent =
    "投票してください。";

  show("guess");
}


// -------------------------
// 投票
// -------------------------

function vote(targetPeer) {

  // 二重投票防止
  const buttons =
    document.querySelectorAll(".choice");

  buttons.forEach(btn => {
    btn.disabled = true;
  });


  // ホスト自身
  if (isHost) {

    if (!votes[currentQuestion]) {
      votes[currentQuestion] = {};
    }

    votes[currentQuestion][peer.id] =
      targetPeer;

    document.getElementById("voteStatus").textContent =
      "投票しました。ほかの人を待っています。";

    checkAllVotes();

    return;
  }


  // 参加者
  hostConn.send({
    type: "vote",
    choice: targetPeer
  });

  document.getElementById("voteStatus").textContent =
    "投票しました。ほかの人を待っています。";
}


// -------------------------
// 全員投票チェック
// -------------------------

function checkAllVotes() {

  if (!isHost) return;

  const currentVotes =
    votes[currentQuestion] || {};

  const answer =
    answers[currentQuestion];

  /*
   * ★★★★★ 重要 ★★★★★
   *
   * 回答者本人は投票しないので、
   * 必要な投票数は
   *
   * players.length - 1
   *
   * です。
   */

  const requiredVotes =
    players.length - 1;

  const actualVotes =
    Object.keys(currentVotes).length;


  document.getElementById("voteStatus").textContent =
    actualVotes +
    " / " +
    requiredVotes +
    " 人が投票済み";


  if (actualVotes >= requiredVotes) {

    revealQuestion();

  }

}


// -------------------------
// 結果表示
// -------------------------

function revealQuestion() {

  const answer =
    answers[currentQuestion];

  const author =
    players.find(p => p.id === answer.peer);


  // 得票数集計
  const count = {};

  players.forEach(p => {
    count[p.id] = 0;
  });


  const currentVotes =
    votes[currentQuestion] || {};


  Object.values(currentVotes).forEach(target => {

    if (count[target] !== undefined) {
      count[target]++;
    }

  });


  const voteResults =
    players.map(p => ({
      id: p.id,
      name: p.name,
      votes: count[p.id] || 0
    }));


  // ホスト画面
  showReveal(
    answer,
    author ? author.name : "不明",
    voteResults
  );


  // 参加者へ
  connections.forEach(conn => {

    if (conn.open) {

      conn.send({
        type: "reveal",
        answer: answer,
        author: author ? author.name : "不明",
        voteResults: voteResults
      });

    }

  });


  // 次の問題
  currentQuestion++;

}


// -------------------------
// 結果表示画面
// -------------------------

function showReveal(answer, author, voteResults) {

  document.getElementById("revealAnswer").textContent =
    answer.text;

  document.getElementById("revealAuthor").textContent =
    "👤 " + author;


  const result =
    document.getElementById("revealVotes");

  result.innerHTML =
    "<h3>投票結果</h3>";


  voteResults
    .sort((a, b) => b.votes - a.votes)
    .forEach(v => {

      const div =
        document.createElement("div");

      div.className = "player";

      div.textContent =
        v.name +
        "： " +
        v.votes +
        "票";

      result.appendChild(div);

    });


  show("hostReveal");


  // ホストだけ次へ進める
  if (isHost) {

    setTimeout(() => {

      showQuestionForEveryone();

    }, 2500);

  }

}


// -------------------------
// ゲーム終了
// -------------------------

function finishGame() {

  showFinished([]);

  connections.forEach(conn => {

    if (conn.open) {

      conn.send({
        type: "finished",
        results: []
      });

    }

  });

}


// -------------------------
// 終了画面
// -------------------------

function showFinished(results) {

  document.getElementById("finalResults").innerHTML =
    "<p>すべての回答が終了しました！</p>";

  show("finished");

}


// -------------------------
// 初期URLチェック
// -------------------------

window.addEventListener("load", () => {

  const params =
    new URLSearchParams(location.search);

  const roomParam =
    params.get("room");

  if (roomParam) {

    document.getElementById("roomInput").value =
      roomParam.toUpperCase();

    document.getElementById("joinArea")
      .classList.remove("hidden");

  }

});

</script>

</body>
</html>
