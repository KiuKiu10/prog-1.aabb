<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>誰が書いたでしょう？オンライン</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
:root{
  --bg:#e8f8ff;
  --card:#fff;
  --main:#36a9d6;
  --main2:#197ea7;
  --text:#243746;
  --muted:#718692;
  --line:#d5edf5;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:linear-gradient(145deg,#e6f8ff,#f8fdff);
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
  color:var(--text);
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:18px;
}

.logo{
  text-align:center;
  font-weight:900;
  color:var(--main2);
  font-size:28px;
  margin:8px 0 18px;
}

.card{
  background:var(--card);
  border-radius:24px;
  padding:24px;
  box-shadow:0 10px 35px #6ba7b522;
  margin-bottom:14px;
}

h2{
  margin:0 0 16px;
}

h3{
  margin-bottom:8px;
}

.muted{
  color:var(--muted);
  font-size:14px;
}

.center{
  text-align:center;
}

input,
textarea,
button{
  font:inherit;
  width:100%;
  border-radius:14px;
  padding:13px;
  border:2px solid var(--line);
}

input,
textarea{
  background:#fbfeff;
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  border:0;
  background:var(--main);
  color:white;
  font-weight:800;
  cursor:pointer;
  margin-top:10px;
}

button:hover{
  filter:brightness(.96);
}

button.secondary{
  background:#8ba0aa;
}

button.orange{
  background:#f2a65a;
}

button.choice{
  background:#fff;
  border:2px solid var(--line);
  color:var(--text);
  text-align:left;
}

button.choice:hover{
  background:#effaff;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.hide{
  display:none!important;
}

.pill{
  display:inline-block;
  background:#eaf8fd;
  padding:7px 12px;
  border-radius:99px;
  margin:4px;
  font-size:14px;
}

.code{
  font-size:30px;
  letter-spacing:5px;
  font-weight:900;
  text-align:center;
  color:var(--main2);
  background:#eefaff;
  padding:12px;
  border-radius:16px;
}

.topic{
  font-size:22px;
  font-weight:900;
  text-align:center;
  background:#f4fcff;
  border-radius:18px;
  padding:18px;
}

.answer{
  border:2px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin:10px 0;
  background:#fbfeff;
}

.answer .txt{
  font-size:23px;
  font-weight:800;
  margin:8px 0;
}

.num{
  color:var(--main2);
  font-weight:900;
}

.bar{
  height:9px;
  background:#e7f3f7;
  border-radius:99px;
  overflow:hidden;
  margin:12px 0;
}

.bar>div{
  height:100%;
  background:var(--main);
  width:0;
}

.result-name{
  font-size:32px;
  font-weight:900;
  color:var(--main2);
}

.vote-status{
  background:#f4fcff;
  border-radius:16px;
  padding:14px;
  margin-top:12px;
}

hr{
  border:0;
  border-top:1px solid var(--line);
  margin:20px 0;
}

@media(max-width:560px){
  .grid{
    grid-template-columns:1fr;
  }

  .wrap{
    padding:12px;
  }

  .card{
    padding:18px;
  }

  .logo{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="logo">
🎮 誰が書いたでしょう？
</div>


<!-- =========================
     ホーム
========================= -->

<section id="home" class="card">

<h2>✨ ゲームを作る</h2>

<input
  id="hostName"
  placeholder="あなたの名前（例：やまだ）"
>

<input
  id="topic"
  style="margin-top:9px"
  placeholder="お題（例：この中で一番モテそうな人は？）"
>

<button onclick="createGame()">
部屋を作る
</button>


<hr>


<h2>🚪 ゲームに参加</h2>

<input
  id="joinRoom"
  placeholder="部屋ID（例：A7K2P）"
>

<input
  id="joinName"
  style="margin-top:9px"
  placeholder="あなたの名前"
>

<button onclick="joinGame()">
参加する
</button>

<p class="muted">
※全員が同じURLを開いて、部屋IDを入力すれば参加できます。
</p>

</section>



<!-- =========================
     待機ルーム
========================= -->

<section id="lobby" class="card hide">

<h2>👥 待機ルーム</h2>

<div class="code" id="roomCode"></div>

<button
  class="secondary"
  onclick="copyInvite()"
>
🔗 招待情報をコピー
</button>

<p
  class="muted center"
  id="status"
>
</p>

<div id="playerList"></div>


<div id="hostLobby">

<hr>

<h3>お題</h3>

<div
  class="topic"
  id="topicLobby"
>
</div>

<button onclick="startRound()">
▶️ 回答スタート
</button>

</div>

</section>



<!-- =========================
     回答
========================= -->

<section id="answer" class="card hide">

<h2>✏️ 回答タイム</h2>

<div
  class="topic"
  id="topicAnswer"
>
</div>

<p class="muted">
自分が書いたと分からないように、回答だけが公開されます。
</p>

<textarea
  id="myAnswer"
  maxlength="200"
  placeholder="思いついた答えを書いてね！"
></textarea>

<div
  class="muted"
  id="answerCount"
>
0 / 200
</div>

<button onclick="submitAnswer()">
回答する
</button>

</section>



<!-- =========================
     ホスト回答確認
========================= -->

<section id="hostManage" class="card hide">

<h2>📋 回答を確認</h2>

<p id="received"></p>

<div class="bar">
  <div id="receivedBar"></div>
</div>

<div id="hostAnswerList"></div>

<button
  id="startGuessBtn"
  onclick="startGuessing()"
>
🤔 当てるタイムへ
</button>

</section>



<!-- =========================
     投票
========================= -->

<section id="guess" class="card hide">

<h2>🤔 誰が書いたでしょう？</h2>

<p
  id="guessProgress"
  class="muted"
>
</p>

<div class="answer">

<div
  class="num"
  id="guessNum"
>
</div>

<div
  class="txt"
  id="guessText"
>
</div>

</div>

<div id="choices"></div>

</section>



<!-- =========================
     ホスト投票待ち
========================= -->

<section id="hostVoting" class="card hide">

<h2>🤔 投票タイム</h2>

<p
  id="hostGuessProgress"
  class="muted"
>
</p>

<div class="answer">

<div
  class="num"
  id="hostGuessNum"
>
</div>

<div
  class="txt"
  id="hostGuessText"
>
</div>

</div>

<div id="hostChoices"></div>

<div
  class="vote-status"
  id="hostVoteStatus"
>
投票を待っています…
</div>

</section>



<!-- =========================
     正解発表
========================= -->

<section id="hostReveal" class="card hide">

<h2>🎉 正解発表</h2>

<div class="answer center">

<div
  class="txt"
  id="revealText"
>
</div>

<div
  class="result-name"
  id="revealName"
>
</div>

</div>

<p
  class="center"
  id="scoreText"
>
</p>

<button
  id="nextBtn"
  onclick="nextQuestion()"
>
次の回答へ
</button>

</section>



<!-- =========================
     終了
========================= -->

<section id="finished" class="card hide center">

<h2>🏆 ゲーム終了！</h2>

<div id="ranking"></div>

<button onclick="location.reload()">
もう一度遊ぶ
</button>

</section>

</div>



<script>

/* =====================================================
   基本変数
===================================================== */

let peer = null;

let hostConn = null;

let conns = [];

let isHost = false;

let myName = "";

let room = "";

let topic = "";

let hostPeerId = "";

let hostDisplayName = "";

let players = [];

let answers = [];

let votes = {};

let qIndex = 0;

let gameStarted = false;

let hasAnswered = false;

let hasVoted = false;



/* =====================================================
   基本関数
===================================================== */

const $ = id => document.getElementById(id);


function show(id){

  document
    .querySelectorAll("section")
    .forEach(s => s.classList.add("hide"));

  $(id).classList.remove("hide");

}


function esc(s){

  return String(s).replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );

}


function rid(){

  return Math
    .random()
    .toString(36)
    .slice(2,7)
    .toUpperCase();

}


function send(c,d){

  if(c && c.open){
    c.send(d);
  }

}


function broadcast(d){

  conns.forEach(c => send(c,d));

}


function amHost(){

  return isHost === true;

}



/* =====================================================
   プレイヤー表示
===================================================== */

function renderPlayers(){

  $("playerList").innerHTML =
    players
      .map(p => {

        let icon = p.host ? "👑" : "👤";

        return `
          <span class="pill">
            ${icon} ${esc(p.name)}
          </span>
        `;

      })
      .join("");

}


function updateStatus(){

  $("status").textContent =
    players.length +
    "人参加中" +
    (hostDisplayName
      ? " / ホスト："+hostDisplayName
      : "");

  renderPlayers();

}



/* =====================================================
   ホストUI
===================================================== */

function setHostUI(enabled){

  $("hostLobby")
    .classList
    .toggle("hide", !enabled);

  $("nextBtn")
    .classList
    .toggle("hide", !enabled);

}



/* =====================================================
   部屋を作る
===================================================== */

async function createGame(){

  myName =
    $("hostName")
      .value
      .trim() ||
    "ホスト";

  topic =
    $("topic")
      .value
      .trim() ||
    "この中で一番○○そうな人は？";

  room = rid();

  isHost = true;

  hostDisplayName = myName;

  peer = new Peer("darewrote-" + room);


  peer.on("open", () => {

    hostPeerId = peer.id;

    players = [
      {
        id: peer.id,
        name: myName,
        host: true
      }
    ];

    $("roomCode").textContent = room;

    $("topicLobby").textContent = topic;

    setHostUI(true);

    updateStatus();

    show("lobby");

  });


  peer.on("connection", c => {

    conns.push(c);

    c.on("open", () => {

      send(c,{
        type:"state",

        players:players,

        topic:topic,

        hostPeerId:hostPeerId,

        hostDisplayName:hostDisplayName,

        gameStarted:gameStarted

      });

    });


    c.on("data", d => {

      hostReceive(c,d);

    });


    c.on("close", () => {

      conns =
        conns.filter(x => x !== c);

      players =
        players.filter(
          p => p.id !== c.peer
        );

      updateStatus();

      broadcast({
        type:"players",
        players:players
      });

    });

  });


  peer.on("error", e => {

    console.error(e);

    alert(
      "通信エラーが発生しました。\n" +
      e.message
    );

  });

}



/* =====================================================
   ホストが参加者から受け取るデータ
===================================================== */

function hostReceive(c,d){


  /* ---------- 参加 ---------- */

  if(d.type === "join"){

    let exists =
      players.some(
        p => p.id === c.peer
      );

    if(!exists){

      players.push({
        id:c.peer,
        name:d.name,
        host:false
      });

    }

    updateStatus();

    broadcast({
      type:"players",
      players:players
    });

    send(c,{
      type:"joined",
      players:players,
      topic:topic
    });

  }



  /* ---------- 回答 ---------- */

  if(d.type === "answer"){

    let existing =
      answers.find(
        a => a.peer === c.peer
      );

    if(!existing){

      answers.push({

        peer:c.peer,

        name:d.name,

        text:d.text

      });

    }

    updateHostAnswers();

  }



  /* ---------- 投票 ---------- */

  if(d.type === "vote"){

    if(!votes[qIndex]){

      votes[qIndex] = {};

    }


    votes[qIndex][c.peer] =
      d.choice;


    renderHostVotes();

    checkAllVotes();

  }

}



/* =====================================================
   招待
===================================================== */

function copyInvite(){

  let url =
    location.href.split("?")[0] +
    "?room=" +
    room;


  navigator.clipboard
    ?.writeText(
      url +
      "\n部屋ID：" +
      room
    )
    .then(() => {

      alert(
        "招待情報をコピーしました！"
      );

    })
    .catch(() => {

      alert(
        "部屋ID：" +
        room +
        " を送ってください"
      );

    });

}



/* =====================================================
   回答スタート
===================================================== */

function startRound(){

  if(!amHost()){

    return alert(
      "部屋の作成者だけが回答タイムを開始できます。"
    );

  }


  if(players.length < 2){

    return alert(
      "2人以上で遊ぶのがおすすめです！"
    );

  }


  answers = [];

  votes = {};

  qIndex = 0;

  gameStarted = true;

  hasAnswered = false;

  hasVoted = false;


  $("myAnswer").value = "";

  $("answerCount").textContent =
    "0 / 200";


  $("topicAnswer").textContent =
    topic;


  broadcast({

    type:"round",

    topic:topic

  });


  show("answer");

}



/* =====================================================
   回答状況
===================================================== */

function updateHostAnswers(){

  let total =
    players.length;


  $("received").textContent =
    `回答：${answers.length} / ${total}人`;


  $("receivedBar").style.width =
    Math.min(
      100,
      answers.length /
      Math.max(1,total) *
      100
    ) + "%";


  $("hostAnswerList").innerHTML =
    answers
      .map((a,i) => {

        return `
          <div class="answer">

            <span class="num">
              回答 ${i+1}
            </span>

            <div class="txt">
              ${esc(a.text)}
            </div>

          </div>
        `;

      })
      .join("");


  $("startGuessBtn").disabled =
    answers.length < players.length;

}



/* =====================================================
   回答送信
===================================================== */

function submitAnswer(){

  let text =
    $("myAnswer")
      .value
      .trim();


  if(!text){

    return alert(
      "回答を書いてください！"
    );

  }


  if(hasAnswered){

    return alert(
      "すでに回答しています。"
    );

  }


  hasAnswered = true;


  /* ---------- ホスト ---------- */

  if(isHost){

    answers.push({

      peer:peer.id,

      name:myName,

      text:text

    });


    $("myAnswer").value = "";

    updateHostAnswers();

    show("hostManage");

    return;

  }



  /* ---------- 参加者 ---------- */

  send(
    hostConn,
    {
      type:"answer",

      name:myName,

      text:text
    }
  );


  $("myAnswer").value = "";

  show("lobby");


  $("status").textContent =
    "回答しました！ホストが次へ進むまで待ってね。";

}



/* =====================================================
   投票開始
===================================================== */

function startGuessing(){

  if(!amHost()){

    return alert(
      "部屋の作成者だけが投票タイムへ進めます。"
    );

  }


  if(answers.length < players.length){

    return alert(
      "まだ全員の回答が揃っていません。"
    );

  }


  qIndex = 0;

  votes = {};

  broadcastQuestion();

}



/* =====================================================
   シャッフル
===================================================== */

function shuffled(a){

  return [...a]
    .sort(
      () => Math.random() - 0.5
    );

}



/* =====================================================
   投票問題を送信
===================================================== */

function broadcastQuestion(){

  if(qIndex >= answers.length){

    finishGame();

    return;

  }


  votes[qIndex] = {};

  hasVoted = false;


  let a =
    answers[qIndex];


  /*
   * 自分自身を除いたプレイヤーを
   * 投票候補にする
   */

  let choices =
    shuffled(
      players.filter(
        p => p.id !== a.id
      )
    );


  /*
   * 実際には
   * 「回答を書いた本人」ではなく
   * 「投票する人自身」を除外する必要があるので、
   * 各クライアント側でも再度除外する。
   */

  let choicesData =
    players.map(p => ({
      id:p.id,
      name:p.name
    }));


  broadcast({

    type:"question",

    index:qIndex,

    total:answers.length,

    text:a.text,

    choices:choicesData

  });


  /*
   * ホスト自身にも投票画面を表示
   */

  showHostVoting(
    a,
    choicesData
  );

}



/* =====================================================
   ホスト投票画面
===================================================== */

function showHostVoting(a,choices){

  $("hostGuessProgress").textContent =
    `${qIndex+1} / ${answers.length}`;


  $("hostGuessNum").textContent =
    "この回答を書いたのは？";


  $("hostGuessText").textContent =
    "「" + a.text + "」";


  let validChoices =
    choices.filter(
      c => c.id !== peer.id
    );


  $("hostChoices").innerHTML =
    validChoices
      .map(c => {

        return `
          <button
            class="choice"
            onclick="hostVote('${c.id}')"
          >
            👤 ${esc(c.name)}
          </button>
        `;

      })
      .join("");


  $("hostVoteStatus").textContent =
    "あなたの投票を選んでください";


  show("hostVoting");

}



/* =====================================================
   ホスト投票
===================================================== */

function hostVote(targetPeer){

  if(hasVoted){

    return;

  }


  if(!votes[qIndex]){

    votes[qIndex] = {};

  }


  votes[qIndex][peer.id] =
    targetPeer;


  hasVoted = true;


  $("hostChoices")
    .querySelectorAll("button")
    .forEach(b => {

      b.disabled = true;

    });


  $("hostVoteStatus").textContent =
    "投票しました！他の人の投票を待っています…";


  renderHostVotes();

  checkAllVotes();

}



/* =====================================================
   ホスト側投票数表示
===================================================== */

function renderHostVotes(){

  let v =
    votes[qIndex] || {};


  let total =
    Object.keys(v).length;


  let expected =
    players.length;


  $("hostVoteStatus").textContent =
    `投票：${total} / ${expected}人`;

}



/* =====================================================
   全員投票完了チェック
===================================================== */

function checkAllVotes(){

  let v =
    votes[qIndex] || {};


  let total =
    Object.keys(v).length;


  /*
   * ホスト＋参加者全員が投票したら
   * 正解発表可能
   */

  if(total >= players.length){

    setTimeout(
      revealQuestion,
      500
    );

  }

}



/* =====================================================
   正解発表
===================================================== */

function revealQuestion(){

  let a =
    answers[qIndex];


  let v =
    votes[qIndex] || {};


  let counts = {};


  Object.values(v)
    .forEach(target => {

      counts[target] =
        (counts[target] || 0) + 1;

    });


  let top =
    Object.entries(counts)
      .sort(
        (a,b) => b[1] - a[1]
      );


  let guessedPeer =
    top[0]?.[0];


  let guessedPlayer =
    players.find(
      p => p.id === guessedPeer
    );


  let guessedName =
    guessedPlayer
      ? guessedPlayer.name
      : "投票なし";


  /*
   * 正解
   */

  $("revealText").textContent =
    a.text;


  $("revealName").innerHTML =
    `正解：${esc(a.name)}
     <br>
     <small style="color:#718692">
       最多投票：${esc(guessedName)}
     </small>`;


  $("scoreText").textContent =
    `投票数：${top[0]?.[1] || 0}票`;


  $("nextBtn").classList.remove(
    "hide"
  );


  broadcast({

    type:"reveal",

    text:a.text,

    correct:a.name,

    guessed:guessedName

  });


  show("hostReveal");

}



/* =====================================================
   次の問題
===================================================== */

function nextQuestion(){

  if(!amHost()){

    return alert(
      "部屋の作成者だけが次へ進めます。"
    );

  }


  qIndex++;


  if(qIndex < answers.length){

    broadcastQuestion();

  }else{

    finishGame();

  }

}



/* =====================================================
   ゲーム終了
===================================================== */

function finishGame(){

  broadcast({
    type:"finish"
  });


  show("finished");


  $("ranking").innerHTML = `
    <p>🎊 おつかれさまでした！</p>

    <p class="muted">
      このゲームはブラウザ上だけで完結します。
    </p>
  `;

}



/* =====================================================
   参加する
===================================================== */

function joinGame(){

  room =
    $("joinRoom")
      .value
      .trim()
      .toUpperCase();


  myName =
    $("joinName")
      .value
      .trim() ||
    "参加者";


  if(!room){

    return alert(
      "部屋IDを入力してください"
    );

  }


  /*
   * 参加者は必ずホストではない
   */

  isHost = false;


  peer = new Peer();


  peer.on("open",() => {

    hostPeerId =
      "darewrote-" + room;


    hostConn =
      peer.connect(
        hostPeerId,
        {
          reliable:true
        }
      );


    hostConn.on("open",() => {

      send(
        hostConn,
        {
          type:"join",

          name:myName
        }
      );

    });


    hostConn.on("data",d => {

      clientReceive(d);

    });


    hostConn.on("close",() => {

      alert(
        "ホストとの接続が切れました。"
      );

      location.reload();

    });

  });


  peer.on("error",e => {

    console.error(e);

    alert(
      "部屋に接続できませんでした。\n\n" +
      "① 部屋IDが正しいか\n" +
      "② ホストが部屋を開いたままか\n" +
      "③ URLが正しいか\n" +
      "を確認してください。"
    );

  });

}



/* =====================================================
   参加者側の受信
===================================================== */

function clientReceive(d){


  /* ---------- 初期状態 ---------- */

  if(d.type === "state"){

    players =
      d.players || [];

    topic =
      d.topic || "";

    hostPeerId =
      d.hostPeerId || hostPeerId;

    hostDisplayName =
      d.hostDisplayName || "";


    $("roomCode").textContent =
      room;


    $("topicLobby").textContent =
      topic;


    setHostUI(false);

    updateStatus();

    show("lobby");

  }



  /* ---------- 参加者一覧 ---------- */

  if(d.type === "players"){

    players =
      d.players || [];


    updateStatus();

  }



  /* ---------- 参加完了 ---------- */

  if(d.type === "joined"){

    players =
      d.players || players;


    topic =
      d.topic || topic;


    $("roomCode").textContent =
      room;


    $("topicLobby").textContent =
      topic;


    setHostUI(false);

    updateStatus();

    show("lobby");

  }



  /* ---------- 回答タイム ---------- */

  if(d.type === "round"){

    topic =
      d.topic;


    hasAnswered = false;


    $("topicAnswer").textContent =
      topic;


    $("myAnswer").value = "";


    $("answerCount").textContent =
      "0 / 200";


    setHostUI(false);

    show("answer");

  }



  /* ---------- 投票 ---------- */

  if(d.type === "question"){

    hasVoted = false;


    $("guessProgress").textContent =
      `${d.index+1} / ${d.total}`;


    $("guessNum").textContent =
      "この回答を書いたのは？";


    $("guessText").textContent =
      "「" + d.text + "」";


    /*
     * 自分自身を候補から除外
     */

    let validChoices =
      d.choices.filter(
        c => c.id !== peer.id
      );


    $("choices").innerHTML =
      validChoices
        .map(c => {

          return `
            <button
              class="choice"
              onclick="vote('${c.id}')"
            >
              👤 ${esc(c.name)}
            </button>
          `;

        })
        .join("");


    show("guess");

  }



  /* ---------- 正解 ---------- */

  if(d.type === "reveal"){

    setHostUI(false);


    $("revealText").textContent =
      d.text;


    $("revealName").innerHTML =
      `正解：${esc(d.correct)}
       <br>
       <small style="color:#718692">
         最多投票：${esc(d.guessed)}
       </small>`;


    $("scoreText").textContent =
      "";


    $("nextBtn").classList.add(
      "hide"
    );


    show("hostReveal");

  }



  /* ---------- 終了 ---------- */

  if(d.type === "finish"){

    show("finished");

  }

}



/* =====================================================
   参加者の投票
===================================================== */

function vote(targetPeer){

  if(hasVoted){

    return;

  }


  hasVoted = true;


  send(
    hostConn,
    {
      type:"vote",

      choice:targetPeer
    }
  );


  $("choices")
    .querySelectorAll("button")
    .forEach(b => {

      b.disabled = true;

    });


  $("revealText").textContent =
    "投票しました！";


  $("revealName").textContent =
    "他の人の投票を待っています…";


  $("nextBtn").classList.add(
    "hide"
  );


  show("hostReveal");

}



/* =====================================================
   回答文字数
===================================================== */

$("myAnswer")
  .addEventListener(
    "input",
    () => {

      $("answerCount")
        .textContent =
        $("myAnswer")
          .value
          .length +
        " / 200";

    }
  );



/* =====================================================
   URLから部屋IDを取得
===================================================== */

const params =
  new URLSearchParams(
    location.search
  );


if(params.get("room")){

  $("joinRoom").value =
    params
      .get("room")
      .toUpperCase();

}

</script>
